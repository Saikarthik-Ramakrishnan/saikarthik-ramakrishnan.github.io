html{

*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}

header a{font-family:'Junicode',Georgia,serif;font-size:27px;font-weight:700;line-height:1.3;color:inherit;text-decoration:none}
footer{font-size:13px;color:var(--mute)}
main{display:flex;align-items:center;justify-content:center;padding:24px 16px}
.win{width:min(440px,100%);padding:3px;border:2px solid;border-color:var(--bv1) var(--bv2) var(--bv2) var(--bv1);background:var(--face);color:var(--facetext);box-shadow:3px 3px 0 rgba(0,0,0,0.3)}
.title{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 3px 3px 8px;background:var(--link);color:var(--bg);font-family:Tahoma,Verdana,Geneva,sans-serif;font-size:12px;font-weight:700;letter-spacing:0.02em}
.x{flex:none;display:grid;place-items:center;width:20px;height:18px;border:2px solid;border-color:var(--bv1) var(--bv2) var(--bv2) var(--bv1);background:var(--face);color:var(--facetext);font:700 12px/1 Tahoma,Verdana,sans-serif;text-decoration:none}
.body{display:flex;gap:16px;padding:20px 14px 8px;font-family:Tahoma,Verdana,Geneva,sans-serif;font-size:13px;line-height:1.5;letter-spacing:0.01em}
.stop{flex:none;position:relative;width:34px;height:34px;border-radius:50%;background:#b3261e;border:2px solid var(--bv2)}
.stop::before,.stop::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:4px;margin:-2px 0 0 -9px;background:#fff;transform:rotate(45deg)}
.stop::after{transform:rotate(-45deg)}
.body h1{margin:0 0 6px;font:700 13px/1.5 Tahoma,Verdana,Geneva,sans-serif}
.body p{margin:0}
.path{display:block;margin-top:10px;padding:4px 6px;border:2px solid;border-color:var(--bv2) var(--bv1) var(--bv1) var(--bv2);background:var(--bg);color:var(--fg);overflow-wrap:anywhere}
.actions{display:flex;justify-content:center;gap:8px;padding:14px 12px 12px}
.btn{display:inline-block;min-width:84px;padding:6px 14px;border:2px solid;border-color:var(--bv1) var(--bv2) var(--bv2) var(--bv1);border-radius:0;background:var(--face);color:var(--facetext);font-family:Tahoma,Verdana,Geneva,sans-serif;font-size:12px;line-height:1;letter-spacing:0.02em;text-align:center;text-decoration:none;cursor:pointer}
.btn:active{border-color:var(--bv2) var(--bv1) var(--bv1) var(--bv2);padding:7px 13px 5px 15px}
.btn:focus-visible,.x:focus-visible{outline:1px dotted var(--facetext);outline-offset:-5px}
.default{box-shadow:0 0 0 1px var(--bv2)}

<main>
  <div class="win" role="alertdialog" aria-labelledby="t" aria-describedby="d">
    <div class="title"><span>Error 404</span><a class="x" href="./" data-home aria-label="Close and go to the home page">×</a></div>
    <div class="body">
      <span class="stop" aria-hidden="true"></span>
      <div>
        <h1 id="t">This page could not be found.</h1>
        <p id="d">The address may be mistyped, or the page may have moved.</p>
        <span class="path" id="path"></span>
      </div>
    </div>
    <div class="actions">
      <a class="btn default" href="./" data-home>OK</a>
      <button class="btn" type="button" id="back">Go back</button>
    </div>
  </div>
</main>

<script>
(() => {
  // Show the address that was asked for, and make "Go back" work.
  document.getElementById('path').textContent = location.pathname;
  document.getElementById('back').addEventListener('click', () => { if (history.length > 1) history.back(); else location.href = document.querySelector('[data-home]').href; });

  // Button click sound: the same click.mp3 the other pages use.
  let ctx = null, buf = null, offset = 0, gain = 1, lastMouse = 0;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      ctx = new AC();
      fetch('click.mp3')
        .then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
        .then((ab) => new Promise((ok, no) => ctx.decodeAudioData(ab, ok, no)))
        .then((b) => {
          const d = b.getChannelData(0);
          let peak = 0;
          for (let k = 0; k < d.length; k++) { const v = Math.abs(d[k]); if (v > peak) peak = v; }
          if (!peak) return;
          let first = 0;
          while (first < d.length && Math.abs(d[first]) < peak * 0.1) first++;
          offset = Math.max(0, first / b.sampleRate - 0.005);
          gain = Math.min(3, 0.7 / peak);
          buf = b;
        })
        .catch(() => {});
    }
  } catch (e) {}
  const play = () => {
    try {
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      if (!buf) return;
      const src = ctx.createBufferSource(), g = ctx.createGain();
      src.buffer = buf; g.gain.value = gain;
      src.connect(g); g.connect(ctx.destination);
      src.start(0, offset);
    } catch (e) {}
  };
  document.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'mouse' || e.button !== 0 || !e.target.closest('.btn, .x')) return;
    lastMouse = Date.now(); play();
  }, true);
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.btn, .x') || Date.now() - lastMouse < 1500) return;
    play();
  }, true);
})();
</script>
